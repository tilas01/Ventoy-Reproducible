[package]
name = "ventoy-verify-gui"
description = "A window for ventoy-verify, for readers who would rather drop a file on a target than type a command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ventoy-verify-gui"
path = "src/main.rs"

[dependencies]
ventoy-verify-core.workspace = true
ventoy-verify-sig.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.15"
