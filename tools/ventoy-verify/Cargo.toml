# SPDX-License-Identifier: GPL-3.0-or-later
#
# `ventoy-verify` is split into four crates rather than one, and the split is a
# security boundary rather than a filing decision.
#
#   core  knows how to hash a file and compare a manifest. It has no network
#         code, no signature code, and no user interface.
#   sig   knows how to check a detached OpenPGP signature. It never touches the
#         filesystem itself: callers hand it bytes.
#   cli   and gui are the only crates allowed to print, prompt or exit. They
#         depend on core and sig, and neither of those depends on them.
#
# The practical result is that the window cannot reach a file except through
# `core`, so there is exactly one place where a path from a user turns into a
# read, and one place to audit it.

[workspace]
resolver = "2"
members = [
    "crates/ventoy-verify-core",
    "crates/ventoy-verify-sig",
    "crates/ventoy-verify-cli",
    "crates/ventoy-verify-gui",
]

# The window is not in the default set. A verification tool has to build on a
# headless runner and inside a minimal container, and `eframe` drags in a
# display stack that neither has. `cargo build` gives you the command line;
# `cargo build -p ventoy-verify-gui` asks for the window on purpose.
default-members = [
    "crates/ventoy-verify-core",
    "crates/ventoy-verify-sig",
    "crates/ventoy-verify-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/tilas01/Ventoy-Reproducible"
authors = ["tilas01"]

[workspace.dependencies]
ventoy-verify-core = { path = "crates/ventoy-verify-core", version = "0.1.0" }
ventoy-verify-sig = { path = "crates/ventoy-verify-sig", version = "0.1.0" }

sha2 = "0.10"
blake3 = "1"
hex = "0.4"
subtle = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
pgp = "0.20"

# Release profile. Every setting here exists to make two builds of the same
# source produce the same bytes, which is the one thing this program is for.
[profile.release]
opt-level = 3
codegen-units = 1       # parallel codegen reorders symbols between runs
lto = "fat"
panic = "abort"         # no unwinding tables, and no landing pads to differ
strip = true            # symbol tables carry paths and ordering
debug = false
incremental = false     # incremental state is per-machine by construction
overflow-checks = true  # a wrong length should abort, not wrap silently
